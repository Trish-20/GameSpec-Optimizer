<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Hardware Utility Panel</title>
    <link rel="stylesheet" href="../../CSS/UserSideStyle.css"> 
</head>
<body class="sidebar-open">

<div class="sidebar">
    <h2>User Panel</h2>
    <button onclick="showTab('browse', this)">Browse Games</button>
    <button onclick="showTab('benchmark', this)">Hardware Benchmark</button>
    <button onclick="showTab('predict', this)">FPS Prediction</button>
</div>

<div class="content">
    <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button> 

    <div id="browse" class="tab">
        <h2>Browse Games</h2>
        <div class="tab-card">
            <div id="gameList"></div>
        </div>
    </div>

    <div id="benchmark" class="tab" style="display:none;">
        <h2>Hardware Benchmark</h2>
        <div class="tab-card">
            <label for="cpu">Enter CPU Model:</label>
            <input id="cpu" type="text" placeholder="e.g., i5-12400F">
            
            <label for="gpu">Enter GPU Model:</label>
            <input id="gpu" type="text" placeholder="e.g., RTX 3060">
            
            <label for="ram">Enter RAM (GB):</label>
            <input id="ram" type="number" placeholder="e.g., 16">
            
            <button onclick="runBenchmark()">Get Benchmark Score</button>
            <h3 id="benchResult"></h3>
        </div>
    </div>

    <div id="predict" class="tab" style="display:none;">
        <h2>FPS Prediction</h2>
        <div class="tab-card">
            <label for="selectedGame">Select a Game:</label>
            <select id="selectedGame">
                <option value="">Select a Game</option>
            </select>

            <label for="cpu2">Enter CPU Model:</label>
            <input id="cpu2" type="text" placeholder="e.g., i5-12400F">
            
            <label for="gpu2">Enter GPU Model:</label>
            <input id="gpu2" type="text" placeholder="e.g., RTX 3060">
            
            <label for="ram2">Enter RAM (GB):</label>
            <input id="ram2" type="number" placeholder="e.g., 16">
            
            <label for="graphicsQuality">Graphics Quality:</label>
            <select id="graphicsQuality">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button onclick="predictFPS()">Predict FPS</button>
            <h3 id="fpsResult"></h3>
        </div>
    </div>
</div>

<script src="../../JAVASCRIPT/UserSideFunction.js"></script>

</body>
</html>
