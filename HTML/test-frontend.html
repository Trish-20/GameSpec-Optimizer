<!DOCTYPE html>
<html>

<head>
    <title>GameSpec Optimizer</title>
</head>

<body>
    <h1>GameSpec Optimizer</h1>
    <form id="specForm">
        CPU Model: <input type="text" name="cpu_model"><br>
        GPU Model: <input type="text" name="gpu_model"><br>
        RAM (GB): <input type="number" name="ram_gb"><br>
        Resolution: <input type="text" name="resolution" placeholder="1920x1080"><br>
        Graphics Preset: <select name="graphics_preset">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>Ultra</option>
        </select><br>
        <button type="submit">Predict FPS</button>
    </form>
    <div id="result"></div>

    <script>
        const form = document.getElementById('specForm');
        form.onsubmit = async e => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);

            const response = await fetch('predict.php', {
                method: 'POST',
                body: new URLSearchParams(data)
            });
            const result = await response.json();
            document.getElementById('result').innerText = 'Predicted FPS: ' + result.predicted_fps;
        };
    </script>
</body>

</html>
